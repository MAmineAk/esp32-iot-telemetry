<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .cards {
            display: flex;
            gap: 20px;
        }
        .card, .graph {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card {
            flex: 1;
        }
        .value {
            font-size: 32px;
            font-weight: bold;
        }
        .small {
            color: gray;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>ESP32 Dashboard</h1>
 
    <div class="cards">
        <div class="card">
            <div>Chip temperature</div>
            <div class="value"><span id="temperature">--</span> °C</div>
            <div class="small">internal sensor of the ESP32-S3, not the room</div>
        </div>
        <div class="card">
            <div>Humidity</div>
            <div class="value"><span id="humidity">--</span> %</div>
            <div class="small">fake value until I add a real sensor</div>
        </div>
    </div>
 
    <div class="graph">
        <h2>Last 30 measurements</h2>
        <canvas id="chart" height="120"></canvas>
        <p id="status" class="small">Loading...</p>
    </div>
 
    <script>
        const chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
                labels: [],
                datasets: [
                    { label: "Temperature (°C)", data: [], borderColor: "red" },
                    { label: "Humidity (%)", data: [], borderColor: "blue" }
                ]
            }
        });
 
        async function refresh() {
            try {
                const response = await fetch("/measurements");
                const measurements = await response.json();
 
                if (measurements.length === 0) {
                    document.getElementById("status").textContent = "No data yet";
                    return;
                }
 
                measurements.sort((a, b) => a.id - b.id);  // oldest first
                const last = measurements[measurements.length - 1];
                document.getElementById("temperature").textContent = last.temperature.toFixed(1);
                document.getElementById("humidity").textContent = last.humidity;
 
                const recent = measurements.slice(-30);
                chart.data.labels = recent.map(m => new Date(m.timestamp).toLocaleTimeString());
                chart.data.datasets[0].data = recent.map(m => m.temperature);
                chart.data.datasets[1].data = recent.map(m => m.humidity);
                chart.update();
 
                document.getElementById("status").textContent = measurements.length + " measurements in the database";
            } catch (err) {
                document.getElementById("status").textContent = "Can't reach the server";
                console.log(err);
            }
        }
 
        refresh();
        setInterval(refresh, 10000);  // same rate as the ESP32
    </script>
</body>
</html>
